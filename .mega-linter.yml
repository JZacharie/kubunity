---
# MegaLinter configuration file for Kubunity
# Documentation: https://megalinter.io

DISABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_STANDARD
  - JSON_JSONLINT
  - YAML_V8R
  - YAML_PRETTIER

# Exclude Go-templated Helm templates, build artifacts, and vendor files from pure YAML/JSON linters
FILTER_REGEX_EXCLUDE: (charts/.*/templates/.*|golden-paths/.*/templates/.*|target/.*|megalinter-reports/.*)

# Apply fixes automatically if possible in CI reports
APPLY_FIXES: none

# Print summary
PRINT_ALPACA: false
