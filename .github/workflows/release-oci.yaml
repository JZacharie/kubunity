name: Release Helm Charts to GHCR (OCI)

on:
  push:
    tags:
      - 'v*'

jobs:
  release-oci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Add Helm Repositories & Build Dependencies
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add aqua https://aquasecurity.github.io/helm-charts/
          helm repo add argo-cd https://argoproj.github.io/argo-helm
          helm repo update
          helm dependency build charts/kubunity

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package & Push Kubunity Core Chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/kubunity --version "${VERSION}" --app-version "${VERSION}" -d /tmp/packages
          helm push /tmp/packages/kubunity-"${VERSION}".tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Package & Push Golden Path Microservice Chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package golden-paths/microservice --version "${VERSION}" --app-version "${VERSION}" -d /tmp/packages
          helm push /tmp/packages/microservice-"${VERSION}".tgz oci://ghcr.io/${{ github.repository_owner }}/charts
