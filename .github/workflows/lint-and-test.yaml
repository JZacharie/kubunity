name: Helm Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Add Helm Repositories & Build Dependencies
        run: |
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add aqua https://aquasecurity.github.io/helm-charts/
          helm repo add argo-cd https://argoproj.github.io/argo-helm
          helm repo update
          helm dependency build charts/kubunity

      - name: Helm Lint - Kubunity Core
        run: |
          helm lint charts/kubunity
          helm lint charts/kubunity -f charts/kubunity/profiles/values-dev.yaml
          helm lint charts/kubunity -f charts/kubunity/profiles/values-cloud.yaml
          helm lint charts/kubunity -f charts/kubunity/profiles/values-edge.yaml

      - name: Helm Lint - Golden Path Microservice
        run: |
          helm lint golden-paths/microservice

      - name: Helm Template Validation
        run: |
          helm template test-kubunity-dev charts/kubunity -f charts/kubunity/profiles/values-dev.yaml > /dev/null
          helm template test-kubunity-cloud charts/kubunity -f charts/kubunity/profiles/values-cloud.yaml > /dev/null
          helm template test-kubunity-edge charts/kubunity -f charts/kubunity/profiles/values-edge.yaml > /dev/null
          helm template test-microservice golden-paths/microservice > /dev/null
