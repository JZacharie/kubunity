[package]
name = "kubunity"
version = "0.2.0"
edition = "2021"
authors = ["JZacharie <contact@kubunity.io>"]
description = "Kubunity : Unified, Declarative & Extensible Kubernetes Platform Engine & CLI in Rust"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/JZacharie/kubunity"
repository = "https://github.com/JZacharie/kubunity"
keywords = ["kubernetes", "gitops", "kyverno", "opentelemetry", "cncf"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async Runtime
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# CLI & UX
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
colored = "2.1"
indicatif = "0.17"
tabled = { version = "0.15", features = ["derive"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error Handling & Logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP & API Client (Optional features)
reqwest = { version = "0.12", features = ["json"], default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

[[bin]]
name = "kubunity"
path = "src/main.rs"

[lib]
name = "kubunity"
path = "src/lib.rs"
