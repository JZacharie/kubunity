{{- if .Values.observability.openTelemetryCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubunity.fullname" . }}-otel-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubunity.labels" . | nindent 4 }}
    app.kubernetes.io/component: "opentelemetry-collector"
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubunity-pods'
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20

      batch:
        send_batch_size: 1024
        timeout: 5s

      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.pod.start_time

      resource:
        attributes:
          - key: kubunity.cluster
            value: {{ .Values.cluster.name | quote }}
            action: upsert
          - key: kubunity.environment
            value: {{ .Values.cluster.environment | quote }}
            action: upsert
          - key: kubunity.profile
            value: {{ .Values.cluster.profile | quote }}
            action: upsert

    exporters:
      debug:
        verbosity: basic

      {{- if .Values.observability.openobserve.enabled }}
      otlphttp/openobserve:
        endpoint: {{ .Values.observability.openobserve.endpoint | default "http://o2-openobserve-router.openobserve.svc:5080/api/default" | quote }}
        headers:
          Authorization: "${env:OPENOBSERVE_AUTH}"
          stream-name: {{ .Values.observability.openobserve.streamName | default "k8s_telemetry" | quote }}
        compression: gzip
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      {{- end }}

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:
            - debug
            {{- if .Values.observability.openobserve.enabled }}
            - otlphttp/openobserve
            {{- end }}
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:
            - debug
            {{- if .Values.observability.openobserve.enabled }}
            - otlphttp/openobserve
            {{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters:
            - debug
            {{- if .Values.observability.openobserve.enabled }}
            - otlphttp/openobserve
            {{- end }}
      telemetry:
        logs:
          level: {{ .Values.observability.openTelemetryCollector.logLevel | default "info" | quote }}
{{- end }}
